<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLAY — Media Player</title>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --surface2: #1e1e21;
    --surface3: #27272b;
    --border: #2e2e33;
    --border2: #3e3e45;
    --text: #f0f0f2;
    --text2: #9898a8;
    --text3: #5e5e6e;
    --accent: #ff6b00;
    --accent2: #ff8c35;
    --accent-dim: rgba(255,107,0,0.18);
    --accent-glow: rgba(255,107,0,0.08);
    --green: #4caf82;
    --blue: #5b9cf6;
    --red: #f26262;
    --radius: 6px;
    --radius-lg: 10px;
  }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }

  /* ---- TITLEBAR ---- */
  #titlebar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 12px;
  }
  #titlebar .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    color: var(--accent);
  }
  #titlebar .file-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--text2);
    flex: 1;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #titlebar .tb-actions { display: flex; gap: 8px; align-items: center; }

  /* ---- MAIN LAYOUT ---- */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ---- PLAYLIST SIDEBAR ---- */
  #sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.2s ease;
  }
  #sidebar.collapsed { width: 0; overflow: hidden; }
  #sidebar-header {
    padding: 10px 14px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--text3);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-transform: uppercase;
  }
  #playlist {
    flex: 1;
    overflow-y: auto;
    padding: 6px;
  }
  #playlist::-webkit-scrollbar { width: 4px; }
  #playlist::-webkit-scrollbar-track { background: transparent; }
  #playlist::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .pl-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 12px;
    color: var(--text2);
    transition: background 0.1s, color 0.1s;
    font-family: 'JetBrains Mono', monospace;
  }
  .pl-item:hover { background: var(--surface2); color: var(--text); }
  .pl-item.active { background: var(--accent-dim); color: var(--accent2); }
  .pl-item .pl-idx { color: var(--text3); min-width: 18px; font-size: 10px; }
  .pl-item .pl-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl-item .pl-remove { opacity: 0; font-size: 14px; color: var(--text3); cursor: pointer; padding: 0 2px; }
  .pl-item:hover .pl-remove { opacity: 1; }

  #sidebar-footer {
    padding: 10px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  /* ---- VIDEO AREA ---- */
  #content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  #video-wrapper {
    flex: 1;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: default;
  }
  #video-wrapper.fullscreen-active { position: fixed; inset: 0; z-index: 1000; }
  #video-wrapper.fullscreen-active #controls { position: absolute; bottom: 0; left: 0; right: 0; }

  #drop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 5;
  }
  #drop-overlay .drop-icon {
    width: 72px;
    height: 72px;
    border: 2px dashed var(--border2);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    color: var(--text3);
  }
  #drop-overlay .drop-text { font-size: 14px; color: var(--text3); text-align: center; line-height: 1.8; }
  #drop-overlay .drop-text span { color: var(--accent2); }
  #drop-overlay.drag-active .drop-icon { border-color: var(--accent); color: var(--accent); }
  #drop-overlay.drag-active .drop-text { color: var(--text2); }

  #player {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: none;
    background: #000;
  }

  /* subtitle display */
  #subtitle-display {
    position: absolute;
    bottom: 64px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    color: #fff;
    font-size: 20px;
    padding: 0;
    text-align: center;
    max-width: 80%;
    pointer-events: none;
    display: none;
    font-family: 'Syne', sans-serif;
    font-weight: 500;
    line-height: 1.6;
    white-space: pre-line;
    text-shadow:
      -1px -1px 0 #000,
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000,
       0    2px 4px rgba(0,0,0,0.9),
       0    0   8px rgba(0,0,0,0.8);
  }

  /* ---- CONTROLS ---- */
  #controls {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 6px 14px 8px;
    flex-shrink: 0;
  }

  /* progress bar */
  #progress-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 5px;
  }
  #time-current, #time-total {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text3);
    min-width: 42px;
  }
  #time-total { text-align: right; }
  #seekbar-wrap {
    flex: 1;
    position: relative;
    height: 18px;
    display: flex;
    align-items: center;
    cursor: pointer;
  }
  #seekbar-bg {
    position: absolute;
    left: 0; right: 0;
    height: 3px;
    background: var(--surface3);
    border-radius: 2px;
    overflow: hidden;
  }
  #seekbar-buf {
    height: 100%;
    background: var(--border2);
    width: 0%;
    transition: width 0.3s;
  }
  #seekbar-fill {
    position: absolute;
    left: 0;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    pointer-events: none;
    width: 0%;
  }
  #seekbar-thumb {
    position: absolute;
    width: 12px;
    height: 12px;
    background: var(--accent);
    border-radius: 50%;
    transform: translateX(-50%);
    left: 0%;
    top: 50%;
    margin-top: -6px;
    pointer-events: none;
    transition: transform 0.1s;
  }
  #seekbar-wrap:hover #seekbar-thumb { transform: translateX(-50%) scale(1.25); }
  #seek-hover-time {
    position: absolute;
    bottom: 22px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    pointer-events: none;
    display: none;
    transform: translateX(-50%);
    white-space: nowrap;
  }

  /* main controls row */
  #ctrl-row {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  #ctrl-left { display: flex; align-items: center; gap: 4px; }
  #ctrl-center { flex: 1; display: flex; align-items: center; justify-content: center; gap: 4px; }
  #ctrl-right { display: flex; align-items: center; gap: 4px; }

  .ctrl-btn {
    background: transparent;
    border: none;
    color: var(--text2);
    padding: 4px 6px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, color 0.1s;
    min-width: 28px;
  }
  .ctrl-btn:hover { background: var(--surface3); color: var(--text); }
  .ctrl-btn.active { color: var(--accent); }
  .ctrl-btn.play-btn {
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-size: 15px;
    min-width: 32px;
  }
  .ctrl-btn.play-btn:hover { background: var(--accent2); }
  .ctrl-btn.skip-btn { font-size: 14px; color: var(--text3); gap: 1px; position: relative; }
  .skip-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    position: absolute;
    bottom: 4px;
    color: var(--text3);
    pointer-events: none;
  }

  /* volume */
  #vol-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #vol-slider {
    -webkit-appearance: none;
    appearance: none;
    width: 72px;
    height: 3px;
    background: var(--surface3);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  #vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px;
    height: 11px;
    background: var(--text2);
    border-radius: 50%;
    cursor: pointer;
  }
  #vol-slider:hover::-webkit-slider-thumb { background: var(--text); }

  /* track menus */
  .track-menu {
    position: absolute;
    bottom: 56px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    min-width: 200px;
    overflow: hidden;
    z-index: 50;
    display: none;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .track-menu.open { display: block; }
  .track-menu-header {
    padding: 8px 14px 6px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }
  .track-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    font-size: 13px;
    color: var(--text2);
    cursor: pointer;
    transition: background 0.1s;
  }
  .track-menu-item:hover { background: var(--surface3); color: var(--text); }
  .track-menu-item.selected { color: var(--accent2); }
  .track-menu-item .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border2);
    flex-shrink: 0;
  }
  .track-menu-item.selected .dot { background: var(--accent); }
  .track-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

  #sub-menu-wrap { position: relative; }
  #audio-menu-wrap { position: relative; }

  /* pill buttons */
  .pill-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.1s, border-color 0.1s, color 0.1s;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .pill-btn:hover { background: var(--surface3); border-color: var(--border2); color: var(--text); }
  .pill-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent2); }

  /* file input */
  #file-input, #folder-input, #subtitle-input {
    position: absolute;
    width: 0; height: 0;
    opacity: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* add file btn */
  .add-btn {
    background: var(--accent);
    border: none;
    color: #fff;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    padding: 5px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: background 0.1s;
    width: 100%;
  }
  .add-btn:hover { background: var(--accent2); }
  .add-btn.secondary {
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border);
  }
  .add-btn.secondary:hover { background: var(--surface3); color: var(--text); }

  /* speed badge */
  #speed-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    padding: 3px 7px;
    background: var(--surface3);
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.1s, background 0.1s;
    border: 1px solid transparent;
  }
  #speed-badge:hover { color: var(--text); background: var(--surface2); border-color: var(--border); }
  #speed-menu {
    position: absolute;
    bottom: 50px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    overflow-y: auto;
    overflow-x: hidden;
    max-height: 320px;
    display: none;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #speed-menu::-webkit-scrollbar { width: 4px; }
  #speed-menu::-webkit-scrollbar-track { background: transparent; }
  #speed-menu::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  #speed-menu.open { display: block; }
  #speed-menu-wrap { position: relative; }
  .speed-item {
    padding: 7px 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text2);
    cursor: pointer;
    transition: background 0.1s;
    text-align: center;
  }
  .speed-item:hover { background: var(--surface3); color: var(--text); }
  .speed-item.selected { color: var(--accent2); }

  /* drag highlight */
  body.drag-over #video-wrapper { outline: 2px dashed var(--accent); }

  svg-icon { font-size: 18px; }

  /* toast */
  #toast {
    position: fixed;
    bottom: 80px;
    left: 50%;
    transform: translateX(-50%) translateY(6px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 7px 16px;
    border-radius: 20px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ---- PREMIUM ANIMATIONS ---- */

  /* Titlebar subtle glow pulse on logo */
  @keyframes logoPulse {
    0%, 100% { text-shadow: 0 0 0px rgba(255,107,0,0); }
    50% { text-shadow: 0 0 12px rgba(255,107,0,0.5); }
  }
  #titlebar .logo {
    animation: logoPulse 4s ease-in-out infinite;
  }

  /* Seek bar glow on fill */
  #seekbar-fill {
    box-shadow: 0 0 6px rgba(255,107,0,0.5);
    transition: width 0.05s linear, box-shadow 0.2s;
  }
  #seekbar-wrap:hover #seekbar-fill {
    box-shadow: 0 0 10px rgba(255,107,0,0.8);
  }

  /* Seekbar height expand on hover */
  #seekbar-wrap:hover #seekbar-bg,
  #seekbar-wrap:hover #seekbar-fill {
    height: 5px;
    transition: height 0.15s ease, width 0.05s linear, box-shadow 0.2s;
  }
  #seekbar-bg, #seekbar-fill {
    transition: height 0.15s ease, width 0.05s linear;
  }

  /* Play button ripple + spin on click */
  @keyframes playRipple {
    0% { box-shadow: 0 0 0 0 rgba(255,107,0,0.5); }
    70% { box-shadow: 0 0 0 12px rgba(255,107,0,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,107,0,0); }
  }
  .ctrl-btn.play-btn {
    transition: background 0.15s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
  }
  .ctrl-btn.play-btn:active {
    transform: scale(0.88);
    animation: playRipple 0.5s ease-out;
  }
  .ctrl-btn.play-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 0 16px rgba(255,107,0,0.4);
  }

  /* Control buttons micro-interaction */
  .ctrl-btn {
    transition: background 0.12s, color 0.12s, transform 0.12s cubic-bezier(0.34,1.56,0.64,1);
  }
  .ctrl-btn:hover { transform: scale(1.1); }
  .ctrl-btn:active { transform: scale(0.92); }
  .ctrl-btn.play-btn:hover { transform: scale(1.08); }

  /* Playlist item slide-in */
  @keyframes plSlideIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  .pl-item { animation: plSlideIn 0.2s ease both; }

  /* Active playlist item accent bar */
  .pl-item.active {
    position: relative;
    overflow: hidden;
  }
  .pl-item.active::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 2px;
    background: var(--accent);
    border-radius: 2px;
    box-shadow: 0 0 6px rgba(255,107,0,0.7);
  }

  /* Drop overlay pulsing icon */
  @keyframes dropPulse {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.06); opacity: 1; }
  }
  #drop-overlay .drop-icon {
    animation: dropPulse 2.5s ease-in-out infinite;
  }
  #drop-overlay.drag-active .drop-icon {
    animation: none;
    transform: scale(1.12);
    border-color: var(--accent);
    box-shadow: 0 0 24px rgba(255,107,0,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }

  /* Controls bar slide up on load */
  @keyframes ctrlSlideUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #controls { animation: ctrlSlideUp 0.4s 0.1s ease both; }

  /* Titlebar fade in */
  @keyframes tbFadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  #titlebar { animation: tbFadeIn 0.35s ease both; }

  /* Sidebar fade in */
  @keyframes sbFadeIn {
    from { opacity: 0; transform: translateX(-10px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  #sidebar { animation: sbFadeIn 0.35s 0.05s ease both; }

  /* Volume slider fill via gradient */
  #vol-slider {
    background: linear-gradient(to right, var(--accent) 0%, var(--accent) var(--vol-pct, 100%), var(--surface3) var(--vol-pct, 100%)) !important;
    transition: height 0.15s ease;
  }
  #vol-slider:hover { height: 5px; }

  /* Volume percentage badge */
  #vol-pct-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    min-width: 28px;
    text-align: right;
    letter-spacing: 0.03em;
    transition: color 0.2s;
    cursor: default;
  }
  #vol-pct-badge.loud { color: var(--accent2); }

  /* Seek thumb glow */
  #seekbar-thumb {
    box-shadow: 0 0 0 2px rgba(255,107,0,0.2);
    transition: transform 0.12s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  }
  #seekbar-wrap:hover #seekbar-thumb {
    transform: translateX(-50%) scale(1.35);
    box-shadow: 0 0 8px rgba(255,107,0,0.6), 0 0 0 3px rgba(255,107,0,0.2);
  }

  /* Speed badge hover */
  #speed-badge {
    transition: color 0.12s, background 0.12s, transform 0.12s cubic-bezier(0.34,1.56,0.64,1);
  }
  #speed-badge:hover { transform: scale(1.08); }

  /* Pill btn hover lift */
  .pill-btn {
    transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.12s cubic-bezier(0.34,1.56,0.64,1);
  }
  .pill-btn:hover { transform: translateY(-1px); }
  .pill-btn:active { transform: translateY(0) scale(0.96); }

  /* Add btn hover lift */
  .add-btn {
    transition: background 0.12s, transform 0.12s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.2s;
  }
  .add-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(255,107,0,0.25); }
  .add-btn:active { transform: translateY(0) scale(0.97); }
  .add-btn.secondary:hover { box-shadow: none; }

  /* Track menu fade in */
  .track-menu {
    animation: none;
    transform-origin: bottom center;
  }
  @keyframes menuPop {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .track-menu.open { animation: menuPop 0.18s ease both; }

  #speed-menu {
    transform-origin: bottom center;
  }
  #speed-menu.open { animation: menuPop 0.18s ease both; }

  /* Video wrapper subtle vignette */
  #video-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.35) 100%);
    z-index: 1;
  }
  #player { position: relative; z-index: 0; }
  #subtitle-display { z-index: 3; }
  #drop-overlay { z-index: 5; }
</style>
</head>
<body>

<!-- TITLEBAR -->
<div id="titlebar">
  <div class="logo">▶ PLAY</div>
  <div class="file-title" id="file-title">PLAY</div>
  <div class="tb-actions">
    <button class="pill-btn" id="toggle-sidebar-btn" onclick="toggleSidebar()" title="Toggle playlist">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="18" rx="1"/><path d="M14 7h7M14 12h7M14 17h7"/></svg>
      PLAYLIST
    </button>
    <button class="pill-btn" id="fs-btn" onclick="toggleFullscreen()" title="Fullscreen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      FULLSCREEN
    </button>
  </div>
</div>

<div id="main">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <span>Queue (<span id="pl-count">0</span>)</span>
      <span id="pl-clear" onclick="clearPlaylist()" style="cursor:pointer;color:var(--text3);font-size:11px;" title="Clear all">✕ clear</span>
    </div>
    <div id="playlist"></div>
    <div id="sidebar-footer">
      <button class="add-btn" onclick="document.getElementById('file-input').click()">+ ADD FILES</button>
      <button class="add-btn secondary" onclick="document.getElementById('folder-input').click()">📁 ADD FOLDER</button>
    </div>
  </div>

  <!-- VIDEO CONTENT -->
  <div id="content">
    <div id="video-wrapper"
         ondragover="handleDragOver(event)"
         ondragleave="handleDragLeave(event)"
         ondrop="handleDrop(event)"
         ondblclick="toggleFullscreen()">

      <div id="drop-overlay">
        <div class="drop-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7l-5-5z"/><path d="M14 2v5h5"/><circle cx="12" cy="15" r="3"/><path d="m9.5 12.5 1 1M14.5 12.5l-1 1"/></svg>
        </div>
        <div class="drop-text">
          Drop video files here<br>
          or <span onclick="document.getElementById('file-input').click()" style="cursor:pointer;text-decoration:underline">browse files</span>
        </div>
      </div>

      <video id="player" onclick="togglePlay(); closeAllMenus();"></video>
      <div id="subtitle-display"></div>
    </div>

    <!-- CONTROLS -->
    <div id="controls">
      <!-- Seek bar -->
      <div id="progress-row">
        <span id="time-current">0:00</span>
        <div id="seekbar-wrap"
             onmousedown="seekStart(event)"
             onmousemove="seekHover(event)"
             onmouseleave="seekLeave()">
          <div id="seekbar-bg"><div id="seekbar-buf"></div></div>
          <div id="seekbar-fill"></div>
          <div id="seekbar-thumb"></div>
          <div id="seek-hover-time"></div>
        </div>
        <span id="time-total" onclick="toggleTimeMode()" title="Click to toggle remaining time" style="cursor:pointer;">0:00</span>
      </div>

      <!-- Controls row -->
      <div id="ctrl-row">
        <!-- LEFT: volume, speed -->
        <div id="ctrl-left">
          <div id="vol-wrap">
            <button class="ctrl-btn" id="mute-btn" onclick="toggleMute()" title="Mute">
              <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </button>
            <input type="range" id="vol-slider" min="0" max="100" value="100" oninput="setVolume(this.value)">
            <span id="vol-pct-badge" class="loud">100%</span>
          </div>
          <div id="speed-menu-wrap">
            <div id="speed-badge" onclick="toggleSpeedMenu()" title="Playback speed">1.0×</div>
            <div id="speed-menu">
              <div class="speed-item" onclick="setSpeed(0.25)">0.25×</div>
              <div class="speed-item" onclick="setSpeed(0.5)">0.5×</div>
              <div class="speed-item" onclick="setSpeed(0.75)">0.75×</div>
              <div class="speed-item selected" onclick="setSpeed(1.0)">1.0×</div>
              <div class="speed-item" onclick="setSpeed(1.25)">1.25×</div>
              <div class="speed-item" onclick="setSpeed(1.5)">1.5×</div>
              <div class="speed-item" onclick="setSpeed(1.75)">1.75×</div>
              <div class="speed-item" onclick="setSpeed(1.8)">1.8×</div>
              <div class="speed-item" onclick="setSpeed(1.9)">1.9×</div>
              <div class="speed-item" onclick="setSpeed(2.0)">2.0×</div>
              <div class="speed-item" onclick="setSpeed(2.1)">2.1×</div>
              <div class="speed-item" onclick="setSpeed(2.2)">2.2×</div>
              <div class="speed-item" onclick="setSpeed(2.3)">2.3×</div>
              <div class="speed-item" onclick="setSpeed(2.4)">2.4×</div>
              <div class="speed-item" onclick="setSpeed(2.5)">2.5×</div>
              <div class="speed-item" onclick="setSpeed(2.6)">2.6×</div>
              <div class="speed-item" onclick="setSpeed(2.7)">2.7×</div>
            </div>
          </div>
        </div>

        <!-- CENTER: playback controls -->
        <div id="ctrl-center">
          <button class="ctrl-btn" onclick="prevTrack()" title="Previous">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
          </button>
          <button class="ctrl-btn skip-btn" onclick="skip(-10)" title="Back 10s" style="width:30px;height:30px;flex-direction:column;gap:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4.51"/></svg>
            <span class="skip-label" style="position:static;font-size:8px;margin-top:-2px;">10</span>
          </button>
          <button class="ctrl-btn play-btn" id="play-btn" onclick="togglePlay()" title="Play/Pause">
            <svg id="play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button class="ctrl-btn skip-btn" onclick="skip(10)" title="Forward 10s" style="width:30px;height:30px;flex-direction:column;gap:0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-.49-4.51"/></svg>
            <span class="skip-label" style="position:static;font-size:8px;margin-top:-2px;">10</span>
          </button>
          <button class="ctrl-btn" onclick="nextTrack()" title="Next">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
          </button>
        </div>

        <!-- RIGHT: subtitle, audio, loop -->
        <div id="ctrl-right">
          <div id="sub-menu-wrap">
            <button class="ctrl-btn pill-btn" id="sub-btn" onclick="toggleSubMenu()" title="Subtitle tracks" style="font-size:11px;gap:5px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 15h4M15 15h2M7 11h2M13 11h4"/></svg>
              SUB
            </button>
            <div class="track-menu" id="sub-menu">
              <div class="track-menu-header">Subtitle tracks</div>
              <div id="sub-track-list"></div>
              <div class="track-menu-divider"></div>
              <div class="track-menu-item" onclick="loadSubtitleFile()">
                <div class="dot"></div>
                <span>Load subtitle file (.srt/.vtt/.ass)…</span>
              </div>
            </div>
          </div>

          <div id="audio-menu-wrap">
            <button class="ctrl-btn pill-btn" id="audio-btn" onclick="toggleAudioMenu()" title="Audio tracks" style="font-size:11px;gap:5px;">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
              AUDIO
            </button>
            <div class="track-menu" id="audio-menu">
              <div class="track-menu-header">Audio tracks</div>
              <div id="audio-track-list"></div>
            </div>
          </div>

          <button class="ctrl-btn" id="loop-btn" onclick="toggleLoop()" title="Loop">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          </button>

          <button class="ctrl-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Shuffle">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Hidden inputs -->
<input type="file" id="file-input" multiple accept="video/*,audio/*" onchange="addFiles(this.files)">
<input type="file" id="folder-input" webkitdirectory multiple accept="video/*,audio/*" onchange="addFiles(this.files)">
<input type="file" id="subtitle-input" accept=".srt,.vtt,.ass,.ssa" onchange="loadSubtitle(this.files[0])">
<div id="toast"></div>

<script>
const video = document.getElementById('player');
const dropOverlay = document.getElementById('drop-overlay');
const playIcon = document.getElementById('play-icon');
const seekFill = document.getElementById('seekbar-fill');
const seekThumb = document.getElementById('seekbar-thumb');
const seekBuf = document.getElementById('seekbar-buf');
const timeCurrent = document.getElementById('time-current');
const timeTotal = document.getElementById('time-total');
const playlistEl = document.getElementById('playlist');
const plCount = document.getElementById('pl-count');
const fileTitle = document.getElementById('file-title');
const subtitleDisplay = document.getElementById('subtitle-display');
const subTrackList = document.getElementById('sub-track-list');
const audioTrackList = document.getElementById('audio-track-list');

let playlist = [];
let currentIndex = -1;
let isLoop = false;
let isShuffle = false;
let isSeeking = false;
let sidebarOpen = true;
let showTimeRemaining = false;
let subtitleCues = [];
let subtitleOn = false;
let currentAudioTrack = 0;
let currentSubTrack = -1;
let externalSubLoaded = false;
let currentSpeed = 1.0;

function fmt(s) {
  if (isNaN(s) || s < 0) return '0:00';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = Math.floor(s % 60);
  if (h > 0) return `${h}:${m.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function toggleTimeMode() {
  showTimeRemaining = !showTimeRemaining;
  timeTotal.style.color = showTimeRemaining ? 'var(--accent2)' : '';
  updateTimeDisplay();
}

function updateTimeDisplay() {
  if (showTimeRemaining && video.duration) {
    const remaining = video.duration - video.currentTime;
    timeTotal.textContent = '-' + fmt(remaining);
  } else {
    timeTotal.textContent = fmt(video.duration || 0);
  }
}

function addFiles(files) {
  const mediaExts = /\.(mp4|mkv|webm|avi|mov|flv|m4v|mp3|ogg|wav|flac|aac|m4a|ogv|3gp)$/i;
  const newFiles = Array.from(files).filter(f => {
    if (!mediaExts.test(f.name)) return false;
    // Deduplicate by name+size
    return !playlist.some(p => p.name === f.name && p.file && p.file.size === f.size);
  });
  newFiles.forEach(f => {
    playlist.push({ name: f.name, url: URL.createObjectURL(f), file: f });
  });
  renderPlaylist();
  if (currentIndex === -1 && playlist.length > 0) loadTrack(0);
}

function renderPlaylist() {
  playlistEl.innerHTML = '';
  plCount.textContent = playlist.length;
  playlist.forEach((item, i) => {
    const el = document.createElement('div');
    el.className = 'pl-item' + (i === currentIndex ? ' active' : '');
    el.innerHTML = `<span class="pl-idx">${i + 1}</span><span class="pl-name" title="${item.name}">${item.name.replace(/\.[^.]+$/, '')}</span><span class="pl-remove" onclick="removeTrack(event, ${i})">✕</span>`;
    el.ondblclick = () => loadTrack(i);
    playlistEl.appendChild(el);
  });
}

function removeTrack(e, i) {
  e.stopPropagation();
  const wasActive = (currentIndex === i);
  URL.revokeObjectURL(playlist[i].url);
  playlist.splice(i, 1);
  if (wasActive) {
    video.pause();
    video.src = '';
    currentIndex = -1;
    currentSubTrack = -1;
    externalSubLoaded = false;
    subtitleCues = [];
    subtitleDisplay.style.display = 'none';
    fileTitle.textContent = 'PLAY';
  } else if (currentIndex > i) {
    currentIndex--;
  }
  renderPlaylist();
  if (playlist.length === 0) {
    showDropOverlay();
  } else if (wasActive && playlist.length > 0) {
    // Load next track (or last if we removed the last)
    loadTrack(Math.min(i, playlist.length - 1));
  }
}

function clearPlaylist() {
  releaseMkvResources();
  playlist.forEach(p => URL.revokeObjectURL(p.url));
  playlist = []; currentIndex = -1;
  currentSubTrack = -1;
  externalSubLoaded = false;
  subtitleCues = [];
  subtitleDisplay.style.display = 'none';
  subtitleDisplay.textContent = '';
  video.pause(); video.src = '';
  seekFill.style.width = '0%';
  seekThumb.style.left = '0%';
  seekBuf.style.width = '0%';
  timeCurrent.textContent = '0:00';
  timeTotal.textContent = '0:00';
  fileTitle.textContent = 'PLAY';
  showDropOverlay();
  renderPlaylist();
}

let mkvMediaSource = null;
let mkvObjectURL = null;

function releaseMkvResources() {
  if (mkvObjectURL) { URL.revokeObjectURL(mkvObjectURL); mkvObjectURL = null; }
  if (mkvMediaSource) { try { if (mkvMediaSource.readyState === 'open') mkvMediaSource.endOfStream(); } catch(e){} mkvMediaSource = null; }
}

function loadTrack(i) {
  if (i < 0 || i >= playlist.length) return;
  currentIndex = i;
  const item = playlist[i];

  releaseMkvResources();
  fileTitle.textContent = item.name.replace(/\.[^.]+$/, '');
  dropOverlay.style.display = 'none';
  video.style.display = 'block';
  subtitleCues = [];
  externalSubLoaded = false;
  currentSubTrack = -1;
  subtitleDisplay.style.display = 'none';
  subtitleDisplay.textContent = '';
  document.title = 'PLAY';
  renderPlaylist();

  const isMkv = /\.mkv$/i.test(item.name);

  if (isMkv && window.MP4Box) {
    showToast('⏳ Loading MKV…');
    loadMkv(item);
  } else {
    video.src = item.url;
    video.load();
    video.addEventListener('canplay', () => {
      video.playbackRate = currentSpeed;
    }, { once: true });
    video.play().catch(() => {});
    setTimeout(() => { updateAudioTracks(); updateSubTracks(); }, 300);
  }
}

function loadMkv(item) {
  const mp4boxFile = MP4Box.createFile();
  const ms = new MediaSource();
  mkvMediaSource = ms;
  const url = URL.createObjectURL(ms);
  mkvObjectURL = url;
  video.src = url;

  ms.addEventListener('sourceopen', () => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const buffer = e.target.result;
      let offset = 0;
      const CHUNK = 4 * 1024 * 1024; // 4MB chunks

      mp4boxFile.onReady = (info) => {
        const tracks = info.tracks;
        const sourceBuffers = {};

        tracks.forEach(track => {
          const mime = track.codec.startsWith('avc') ? `video/mp4; codecs="${track.codec}"` :
                       track.codec.startsWith('mp4a') ? `audio/mp4; codecs="${track.codec}"` :
                       track.codec.startsWith('Opus') || track.codec.startsWith('opus') ? `audio/mp4; codecs="opus"` :
                       track.codec.startsWith('vp0') || track.codec.startsWith('vp9') ? `video/mp4; codecs="${track.codec}"` : null;

          if (mime && MediaSource.isTypeSupported(mime)) {
            try {
              const sb = ms.addSourceBuffer(mime);
              sb.mode = 'segments';
              sourceBuffers[track.id] = sb;
              mp4boxFile.setSegmentOptions(track.id, sb, { nbSamples: 100 });
            } catch(e) { console.warn('Codec not supported:', mime, e); }
          }
        });

        if (Object.keys(sourceBuffers).length === 0) {
          showToast('❌ Codec not supported by browser');
          video.src = item.url; // fallback
          video.load(); video.play().catch(()=>{});
          return;
        }

        const initSegs = mp4boxFile.initializeSegmentation();
        initSegs.forEach(seg => {
          const sb = sourceBuffers[seg.id];
          if (sb) sb.appendBuffer(seg.buffer);
        });

        mp4boxFile.onSegment = (id, user, buffer) => {
          const sb = sourceBuffers[id];
          if (!sb) return;
          if (sb.updating) {
            sb.addEventListener('updateend', () => sb.appendBuffer(buffer), { once: true });
          } else {
            try { sb.appendBuffer(buffer); } catch(e) {}
          }
        };

        mp4boxFile.start();
        showToast('▶ Playing MKV');
        video.addEventListener('canplay', () => { video.playbackRate = currentSpeed; }, { once: true });
        video.play().catch(() => {});
        setTimeout(() => { updateAudioTracks(); updateSubTracks(); }, 500);
      };

      mp4boxFile.onError = (e) => {
        console.warn('MP4Box error:', e);
        showToast('⚠ MKV parse error — trying direct play');
        video.src = item.url; video.load(); video.play().catch(()=>{});
      };

      // Feed buffer in chunks
      function feedChunk() {
        if (offset >= buffer.byteLength) {
          mp4boxFile.flush();
          return;
        }
        const chunk = buffer.slice(offset, offset + CHUNK);
        chunk.fileStart = offset;
        offset += CHUNK;
        mp4boxFile.appendBuffer(chunk);
        setTimeout(feedChunk, 0);
      }
      feedChunk();
    };
    reader.readAsArrayBuffer(item.file);
  }, { once: true });
}

function showDropOverlay() {
  dropOverlay.style.display = 'flex';
  video.style.display = 'none';
}

function togglePlay() {
  if (currentIndex === -1 || !video.src || video.src === window.location.href) return;
  video.paused ? video.play() : video.pause();
}

function skip(sec) {
  if (currentIndex === -1 || !video.duration) return;
  video.currentTime = Math.max(0, Math.min(video.duration, video.currentTime + sec));
}

function prevTrack() {
  if (video.currentTime > 3) { video.currentTime = 0; return; }
  const i = isShuffle ? randomIdx() : currentIndex - 1;
  if (i >= 0) loadTrack(i);
}

function nextTrack() {
  const i = isShuffle ? randomIdx() : currentIndex + 1;
  if (i < playlist.length) loadTrack(i);
  else if (isLoop && playlist.length > 0) loadTrack(0);
}

function randomIdx() {
  if (playlist.length <= 1) return 0;
  let i; do { i = Math.floor(Math.random() * playlist.length); } while (i === currentIndex);
  return i;
}

function setVolume(v) {
  video.volume = v / 100;
  video.muted = v == 0;
  updateVolIcon(v);
  const slider = document.getElementById('vol-slider');
  slider.value = v;
  slider.style.setProperty('--vol-pct', v + '%');
  const badge = document.getElementById('vol-pct-badge');
  badge.textContent = Math.round(v) + '%';
  badge.classList.toggle('loud', v > 60);
}

function toggleMute() {
  video.muted = !video.muted;
  const v = video.muted ? 0 : video.volume * 100;
  updateVolIcon(v);
  const slider = document.getElementById('vol-slider');
  slider.style.setProperty('--vol-pct', v + '%');
  const badge = document.getElementById('vol-pct-badge');
  badge.textContent = Math.round(v) + '%';
  badge.classList.toggle('loud', v > 60);
}

function updateVolIcon(v) {
  const icon = document.getElementById('vol-icon');
  if (v == 0) {
    icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
  } else if (v < 50) {
    icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>`;
  } else {
    icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>`;
  }
}

function toggleLoop() {
  isLoop = !isLoop;
  document.getElementById('loop-btn').classList.toggle('active', isLoop);
}
function toggleShuffle() {
  isShuffle = !isShuffle;
  document.getElementById('shuffle-btn').classList.toggle('active', isShuffle);
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.getElementById('video-wrapper').requestFullscreen();
  } else {
    document.exitFullscreen();
  }
}

let speedMenuOpen = false;
function toggleSpeedMenu() {
  speedMenuOpen = !speedMenuOpen;
  document.getElementById('speed-menu').classList.toggle('open', speedMenuOpen);
}
function setSpeed(s) {
  currentSpeed = s;
  video.playbackRate = s;
  document.getElementById('speed-badge').textContent = s + '×';
  document.querySelectorAll('.speed-item').forEach(el => {
    el.classList.toggle('selected', parseFloat(el.textContent) === s);
  });
  speedMenuOpen = false;
  document.getElementById('speed-menu').classList.remove('open');
}

// Audio tracks
function updateAudioTracks() {
  audioTrackList.innerHTML = '';
  const tracks = video.audioTracks;
  if (!tracks || tracks.length === 0) {
    audioTrackList.innerHTML = '<div class="track-menu-item" style="color:var(--text3)"><div class="dot"></div><span>Default audio</span></div>';
    return;
  }
  for (let i = 0; i < tracks.length; i++) {
    const t = tracks[i];
    const el = document.createElement('div');
    el.className = 'track-menu-item' + (i === 0 ? ' selected' : '');
    el.innerHTML = `<div class="dot"></div><span>${t.label || ('Track ' + (i+1))} ${t.language ? '('+t.language+')' : ''}</span>`;
    const idx = i;
    el.onclick = () => {
      for (let j = 0; j < tracks.length; j++) tracks[j].enabled = (j === idx);
      audioTrackList.querySelectorAll('.track-menu-item').forEach((e,j) => e.classList.toggle('selected', j === idx));
    };
    audioTrackList.appendChild(el);
  }
}

function cycleAudioTrack() {
  const tracks = video.audioTracks;
  if (!tracks || tracks.length <= 1) return;
  // Find currently enabled track
  let current = 0;
  for (let i = 0; i < tracks.length; i++) {
    if (tracks[i].enabled) { current = i; break; }
  }
  const next = (current + 1) % tracks.length;
  for (let i = 0; i < tracks.length; i++) tracks[i].enabled = (i === next);
  audioTrackList.querySelectorAll('.track-menu-item').forEach((e, i) => e.classList.toggle('selected', i === next));
  // Show a brief toast with the track name
  const label = tracks[next].label || ('Track ' + (next + 1));
  const lang = tracks[next].language ? ` (${tracks[next].language})` : '';
  showToast('🎵 Audio: ' + label + lang);
}

// Subtitle tracks
function updateSubTracks() {
  subTrackList.innerHTML = '';
  const off = document.createElement('div');
  off.className = 'track-menu-item' + (currentSubTrack === -1 ? ' selected' : '');
  off.innerHTML = `<div class="dot"></div><span>Off</span>`;
  off.onclick = () => { disableAllSubs(); currentSubTrack = -1; renderSubList(); };
  subTrackList.appendChild(off);

  const textTracks = video.textTracks;
  for (let i = 0; i < textTracks.length; i++) {
    const t = textTracks[i];
    if (t.kind !== 'subtitles' && t.kind !== 'captions') continue;
    const el = document.createElement('div');
    el.className = 'track-menu-item' + (currentSubTrack === i ? ' selected' : '');
    el.innerHTML = `<div class="dot"></div><span>${t.label || ('Track ' + (i+1))} ${t.language ? '('+t.language+')' : ''}</span>`;
    const idx = i;
    el.onclick = () => {
      disableAllSubs(); t.mode = 'hidden'; currentSubTrack = idx;
      renderSubList();
    };
    subTrackList.appendChild(el);
  }
}

function renderSubList() {
  const items = subTrackList.querySelectorAll('.track-menu-item');
  // items[0] = "Off", items[1..n] = embedded tracks, last may be external (.ext-sub)
  items.forEach((el, i) => {
    if (i === 0) {
      el.classList.toggle('selected', currentSubTrack === -1);
    } else if (el.classList.contains('ext-sub')) {
      el.classList.toggle('selected', currentSubTrack === 9999);
    } else {
      el.classList.toggle('selected', (i - 1) === currentSubTrack);
    }
  });
}

function disableAllSubs() {
  const textTracks = video.textTracks;
  for (let i = 0; i < textTracks.length; i++) textTracks[i].mode = 'disabled';
  subtitleDisplay.style.display = 'none';
  subtitleDisplay.textContent = '';
  subtitleCues = [];
  externalSubLoaded = false;
}

function toggleSubtitles() {
  // If external sub is loaded, toggle it directly
  if (externalSubLoaded) {
    if (subtitleDisplay.style.display === 'none' || subtitleDisplay.style.display === '') {
      subtitleDisplay.style.display = 'block';
    } else {
      subtitleDisplay.style.display = 'none';
    }
    return;
  }
  // If embedded tracks exist, toggle the first one on/off
  const textTracks = video.textTracks;
  const hasTracks = textTracks && textTracks.length > 0;
  if (!hasTracks) return;
  if (currentSubTrack === -1) {
    // Turn on first available subtitle/caption track
    for (let i = 0; i < textTracks.length; i++) {
      if (textTracks[i].kind === 'subtitles' || textTracks[i].kind === 'captions') {
        disableAllSubs();
        textTracks[i].mode = 'hidden';
        currentSubTrack = i;
        renderSubList();
        return;
      }
    }
  } else {
    // Turn off
    disableAllSubs();
    currentSubTrack = -1;
    renderSubList();
  }
}

let subMenuOpen = false;
function toggleSubMenu() {
  subMenuOpen = !subMenuOpen;
  document.getElementById('sub-menu').classList.toggle('open', subMenuOpen);
  if (subMenuOpen) updateSubTracks();
  if (subMenuOpen) document.getElementById('audio-menu').classList.remove('open'), audioMenuOpen = false;
}
let audioMenuOpen = false;
function toggleAudioMenu() {
  audioMenuOpen = !audioMenuOpen;
  document.getElementById('audio-menu').classList.toggle('open', audioMenuOpen);
  if (audioMenuOpen) updateAudioTracks();
  if (audioMenuOpen) document.getElementById('sub-menu').classList.remove('open'), subMenuOpen = false;
}

function closeAllMenus() {
  subMenuOpen = false; document.getElementById('sub-menu').classList.remove('open');
  audioMenuOpen = false; document.getElementById('audio-menu').classList.remove('open');
  speedMenuOpen = false; document.getElementById('speed-menu').classList.remove('open');
}

// Close menus on outside click
document.addEventListener('click', e => {
  if (!e.target.closest('#sub-menu-wrap')) { subMenuOpen = false; document.getElementById('sub-menu').classList.remove('open'); }
  if (!e.target.closest('#audio-menu-wrap')) { audioMenuOpen = false; document.getElementById('audio-menu').classList.remove('open'); }
  if (!e.target.closest('#speed-menu-wrap')) { speedMenuOpen = false; document.getElementById('speed-menu').classList.remove('open'); }
});

// External subtitle loading
function loadSubtitleFile() {
  document.getElementById('subtitle-input').click();
  subMenuOpen = false;
  document.getElementById('sub-menu').classList.remove('open');
}

function loadSubtitle(file) {
  if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    if (ext === 'vtt') subtitleCues = parseVTT(text);
    else if (ext === 'srt') subtitleCues = parseSRT(text);
    else if (ext === 'ass' || ext === 'ssa') subtitleCues = parseASS(text);
    else { alert('Unsupported subtitle format: .' + ext); return; }
    externalSubLoaded = true;
    currentSubTrack = 9999;
    subtitleOn = true;
    addSubTrackToMenu(file.name);
    // reset input so same file can be reloaded
    document.getElementById('subtitle-input').value = '';
  };
  reader.readAsText(file, 'UTF-8');
}

function addSubTrackToMenu(name) {
  const existing = subTrackList.querySelector('.ext-sub');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'track-menu-item selected ext-sub';
  el.innerHTML = `<div class="dot" style="background:var(--accent)"></div><span>${name}</span>`;
  el.onclick = () => {
    currentSubTrack = 9999;
    subTrackList.querySelectorAll('.track-menu-item').forEach(e => e.classList.remove('selected'));
    el.classList.add('selected');
  };
  subTrackList.appendChild(el);
}

// ---- ASS/SSA Parser ----
function parseASS(text) {
  const cues = [];
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
  let inEvents = false;
  let fmtCols = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (line.toLowerCase() === '[events]') { inEvents = true; continue; }
    if (line.startsWith('[') && line !== '[Events]') { inEvents = false; continue; }
    if (!inEvents) continue;

    if (line.toLowerCase().startsWith('format:')) {
      fmtCols = line.slice(7).split(',').map(s => s.trim().toLowerCase());
      continue;
    }

    if (!line.toLowerCase().startsWith('dialogue:')) continue;
    if (!fmtCols) continue;

    // Split only up to fmtCols.length fields (last field "Text" may contain commas)
    const raw2 = line.slice(line.indexOf(':') + 1);
    const parts = raw2.split(',');
    const numCols = fmtCols.length;
    // Text is the last column — everything after the first (numCols-1) commas
    const fields = parts.slice(0, numCols - 1);
    const textPart = parts.slice(numCols - 1).join(',');

    const getField = name => {
      const idx = fmtCols.indexOf(name);
      return idx >= 0 ? (fields[idx] || '').trim() : '';
    };

    const startStr = getField('start');
    const endStr = getField('end');
    if (!startStr || !endStr) continue;

    // Skip "Warning" style lines — fansubber trap for unsupported players
    const style = getField('style');
    if (/^warning$/i.test(style)) continue;

    // Skip intentionally invisible lines:
    // \fscx0 or \fscy0 = scaled to 0 (invisible), \clip(0,0,0,0) = clipped to nothing
    const rawText = textPart.trim();
    if (/\{[^}]*\\fscx0[^}]*\}/.test(rawText)) continue;
    if (/\{[^}]*\\fscy0[^}]*\}/.test(rawText)) continue;
    if (/\{[^}]*\\clip\(\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\)[^}]*\}/.test(rawText)) continue;

    const start = assTimeToSec(startStr);
    const end = assTimeToSec(endStr);
    if (isNaN(start) || isNaN(end) || end <= start) continue;

    const cleanText = cleanASSText(textPart);
    if (!cleanText.trim()) continue;

    cues.push({ start, end, text: cleanText });
  }

  // Sort by start time
  cues.sort((a, b) => a.start - b.start);
  return cues;
}

function assTimeToSec(s) {
  // Format: H:MM:SS.cc  (centiseconds)
  const m = s.match(/^(\d+):(\d{2}):(\d{2})[.,](\d+)$/);
  if (!m) return NaN;
  return parseInt(m[1]) * 3600 + parseInt(m[2]) * 60 + parseInt(m[3]) + parseInt(m[4]) / 100;
}

function cleanASSText(text) {
  return text
    // Strip all override tags: {...}
    .replace(/\{[^}]*\}/g, '')
    // Convert \N \n \h to newline/space
    .replace(/\\N/g, '\n')
    .replace(/\\n/g, '\n')
    .replace(/\\h/g, ' ')
    // Strip any remaining HTML-like tags
    .replace(/<[^>]+>/g, '')
    .trim();
}

// ---- SRT Parser ----
function parseSRT(text) {
  const cues = [];
  const blocks = text.trim().split(/\n\s*\n/);
  blocks.forEach(block => {
    const lines = block.split('\n');
    const timeMatch = lines.find(l => l.includes('-->'));
    if (!timeMatch) return;
    const [start, end] = timeMatch.split('-->').map(s => srtTimeToSec(s.trim()));
    const content = lines.slice(lines.indexOf(timeMatch) + 1).join('\n').replace(/<[^>]+>/g, '');
    cues.push({ start, end, text: content });
  });
  return cues;
}

// ---- VTT Parser ----
function parseVTT(text) {
  const cues = [];
  const lines = text.split('\n');
  let i = 0;
  while (i < lines.length) {
    if (lines[i].includes('-->')) {
      const [start, end] = lines[i].split('-->').map(s => vttTimeToSec(s.trim().split(' ')[0]));
      i++;
      let content = '';
      while (i < lines.length && lines[i].trim() !== '') { content += (content ? '\n' : '') + lines[i]; i++; }
      cues.push({ start, end, text: content.replace(/<[^>]+>/g, '') });
    }
    i++;
  }
  return cues;
}

function srtTimeToSec(s) {
  const [h,m,rest] = s.split(':'); const [sec, ms] = rest.replace(',','.').split('.');
  return parseInt(h)*3600 + parseInt(m)*60 + parseInt(sec) + parseFloat('0.'+ms);
}
function vttTimeToSec(s) {
  const parts = s.split(':');
  if (parts.length === 3) return parseInt(parts[0])*3600 + parseInt(parts[1])*60 + parseFloat(parts[2]);
  return parseInt(parts[0])*60 + parseFloat(parts[1]);
}

// Seekbar
function seekStart(e) {
  isSeeking = true;
  seekTo(e);
  document.addEventListener('mousemove', seekMove);
  document.addEventListener('mouseup', seekEnd);
}
function seekMove(e) { if (isSeeking) seekTo(e); }
function seekEnd() { isSeeking = false; document.removeEventListener('mousemove', seekMove); document.removeEventListener('mouseup', seekEnd); }

function seekTo(e) {
  const wrap = document.getElementById('seekbar-wrap');
  const rect = wrap.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  if (video.duration) video.currentTime = pct * video.duration;
}

function seekHover(e) {
  const wrap = document.getElementById('seekbar-wrap');
  const rect = wrap.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  const ht = document.getElementById('seek-hover-time');
  ht.style.display = 'block';
  ht.style.left = (pct * rect.width) + 'px';
  ht.textContent = fmt((video.duration || 0) * pct);
}
function seekLeave() { document.getElementById('seek-hover-time').style.display = 'none'; }

// Video events
video.addEventListener('timeupdate', () => {
  const pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
  seekFill.style.width = pct + '%';
  seekThumb.style.left = pct + '%';
  timeCurrent.textContent = fmt(video.currentTime);
  updateTimeDisplay();

  if (externalSubLoaded && subtitleCues.length > 0) {
    const t = video.currentTime;
    const cue = subtitleCues.find(c => t >= c.start && t <= c.end);
    if (cue) { subtitleDisplay.textContent = cue.text; subtitleDisplay.style.display = 'block'; }
    else subtitleDisplay.style.display = 'none';
  } else if (currentSubTrack >= 0 && currentSubTrack !== 9999) {
    const track = video.textTracks[currentSubTrack];
    if (track && track.activeCues && track.activeCues.length > 0) {
      subtitleDisplay.textContent = track.activeCues[0].text;
      subtitleDisplay.style.display = 'block';
    } else subtitleDisplay.style.display = 'none';
  }
});

video.addEventListener('progress', () => {
  if (video.buffered.length > 0 && video.duration) {
    seekBuf.style.width = (video.buffered.end(video.buffered.length - 1) / video.duration * 100) + '%';
  }
});

video.addEventListener('loadedmetadata', () => {
  updateTimeDisplay();
  updateAudioTracks();
});

video.addEventListener('play', () => {
  playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>`;
});

video.addEventListener('pause', () => {
  playIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"/>`;
});

video.addEventListener('ended', () => {
  if (isLoop && playlist.length === 1) { video.currentTime = 0; video.play(); }
  else nextTrack();
});

video.addEventListener('volumechange', () => {
  const v = video.muted ? 0 : video.volume * 100;
  const slider = document.getElementById('vol-slider');
  slider.value = v;
  slider.style.setProperty('--vol-pct', v + '%');
  const badge = document.getElementById('vol-pct-badge');
  badge.textContent = Math.round(v) + '%';
  badge.classList.toggle('loud', v > 60);
});

// Drag and drop
function handleDragOver(e) {
  e.preventDefault();
  document.body.classList.add('drag-over');
  dropOverlay.classList.add('drag-active');
}
function handleDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    document.body.classList.remove('drag-over');
    dropOverlay.classList.remove('drag-active');
  }
}
function handleDrop(e) {
  e.preventDefault();
  document.body.classList.remove('drag-over');
  dropOverlay.classList.remove('drag-active');
  const files = Array.from(e.dataTransfer.files);
  const subFile = files.find(f => /\.(srt|vtt|ass|ssa)$/i.test(f.name));
  if (subFile) { loadSubtitle(subFile); }
  const mediaFiles = files.filter(f => /\.(mp4|mkv|webm|avi|mov|flv|m4v|mp3|ogg|wav|flac|aac|m4a|ogv|3gp)$/i.test(f.name));
  if (mediaFiles.length) addFiles(mediaFiles);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (['INPUT','TEXTAREA'].includes(e.target.tagName)) return;
  switch(e.code) {
    case 'Space': e.preventDefault(); togglePlay(); break;
    case 'ArrowRight': e.preventDefault(); skip(e.shiftKey ? 30 : 10); break;
    case 'ArrowLeft': e.preventDefault(); skip(e.shiftKey ? -30 : -10); break;
    case 'ArrowUp': e.preventDefault(); setVolume(Math.min(100, video.volume * 100 + 5)); break;
    case 'ArrowDown': e.preventDefault(); setVolume(Math.max(0, video.volume * 100 - 5)); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyF': toggleFullscreen(); break;
    case 'KeyN': nextTrack(); break;
    case 'KeyP': toggleSidebar(); break;
    case 'KeyL': toggleLoop(); break;
    case 'KeyC': toggleSubtitles(); break;
    case 'KeyV': cycleAudioTrack(); break;
    case 'PageUp': e.preventDefault(); prevTrack(); break;
    case 'PageDown': e.preventDefault(); nextTrack(); break;
    case 'KeyI': toggleControlsBar(); break;
    case 'KeyO': toggleTitleBar(); break;
    case 'KeyX': toggleCleanMode(); break;
    case 'BracketLeft': {
      const speeds = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7];
      const cur = video.playbackRate;
      const idx = speeds.findIndex(s => s >= cur);
      const newIdx = idx <= 0 ? 0 : idx - 1;
      setSpeed(speeds[newIdx]);
      break;
    }
    case 'BracketRight': {
      const speeds = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 1.8, 1.9, 2.0, 2.1, 2.2, 2.3, 2.4, 2.5, 2.6, 2.7];
      const cur = video.playbackRate;
      const idx = speeds.findLastIndex(s => s <= cur);
      const newIdx = idx >= speeds.length - 1 ? speeds.length - 1 : idx + 1;
      setSpeed(speeds[newIdx]);
      break;
    }
  }
});

// Init
renderPlaylist();
// Init vol slider fill
(function(){
  const s = document.getElementById('vol-slider');
  s.style.setProperty('--vol-pct', '100%');
})();

let controlsBarVisible = true;
function toggleControlsBar() {
  controlsBarVisible = !controlsBarVisible;
  document.getElementById('controls').style.display = controlsBarVisible ? '' : 'none';
}

let titleBarVisible = true;
function toggleTitleBar() {
  titleBarVisible = !titleBarVisible;
  document.getElementById('titlebar').style.display = titleBarVisible ? '' : 'none';
}

let cleanModeActive = false;
function toggleCleanMode() {
  cleanModeActive = !cleanModeActive;
  const sidebar = document.getElementById('sidebar');
  const titlebar = document.getElementById('titlebar');
  const ctrlRow = document.getElementById('ctrl-row');
  if (cleanModeActive) {
    sidebar.style.display = 'none';
    titlebar.style.display = 'none';
    ctrlRow.style.display = 'none';
    showToast('X — clean mode ON');
  } else {
    sidebar.style.display = '';
    titlebar.style.display = '';
    ctrlRow.style.display = '';
    showToast('X — clean mode OFF');
  }
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
